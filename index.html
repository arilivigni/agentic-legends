<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Agentic Legends — Save the Mainline of Codia</title>
    <meta
      name="description"
      content="Save the land of Codia and restore the sacred Mainline with the help of three mythical creatures and their gifts." />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; background: #0d1117; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; color: #e6edf3; touch-action: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
      #game { width: 100vw; height: 100dvh; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
      #game canvas { image-rendering: pixelated; max-width: 100%; max-height: 100%; box-shadow: 0 0 60px rgba(120, 90, 220, 0.25); }
      #boot-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-msg">Loading Codia…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
